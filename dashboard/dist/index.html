<title>Rapport de campagne Minijeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: compact sticky bar (campaign, filters, tabs), one tab visible at a time.
   Overview first: 4 headline numbers, then supporting KPIs, one trend, BU split, points of attention.
   One working hue (blue) on quiet neutrals; region colors only where regions are compared. */
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --sunken: #f0f0ed;
  --ink: #17181a;
  --ink-2: #4a4c50;
  --muted: #7c7e83;
  --line: #e6e6e2;
  --line-2: #d4d4cf;
  --accent: #2557c7;
  --accent-ink: #ffffff;
  --accent-wash: #eaf0fc;
  --data: #2a78d6;
  --data-soft: #c9dcf5;
  --data-ghost: #9aa0a8;

  --r-atl: #2a78d6;
  --r-qc: #eb6834;
  --r-cc: #1baf7a;
  --r-wc: #eda100;

  --good: #0ca30c;
  --good-ink: #0b7a0b;
  --warning: #fab219;
  --critical: #d03b3b;
  --critical-ink: #b42b2b;

  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 12px;
  --gutter: clamp(16px, 3vw, 36px);
  --maxw: 1280px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111213;
    --surface: #1a1b1d;
    --sunken: #222326;
    --ink: #f2f2f0;
    --ink-2: #c4c5c8;
    --muted: #8f9196;
    --line: #2a2b2e;
    --line-2: #3a3b3f;
    --accent: #8aa8ff;
    --accent-ink: #111213;
    --accent-wash: #1e2741;
    --data: #3987e5;
    --data-soft: #23426b;
    --data-ghost: #6b6f76;
    --r-atl: #3987e5;
    --r-qc: #d95926;
    --r-cc: #199e70;
    --r-wc: #c98500;
    --good-ink: #2fbf2f;
    --critical-ink: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111213;
  --surface: #1a1b1d;
  --sunken: #222326;
  --ink: #f2f2f0;
  --ink-2: #c4c5c8;
  --muted: #8f9196;
  --line: #2a2b2e;
  --line-2: #3a3b3f;
  --accent: #8aa8ff;
  --accent-ink: #111213;
  --accent-wash: #1e2741;
  --data: #3987e5;
  --data-soft: #23426b;
  --data-ghost: #6b6f76;
  --r-atl: #3987e5;
  --r-qc: #d95926;
  --r-cc: #199e70;
  --r-wc: #c98500;
  --good-ink: #2fbf2f;
  --critical-ink: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
h2, h3 { margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Sticky bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-inline: var(--gutter);
}
.bar-row, .filters, .tabs { max-width: var(--maxw); margin-inline: auto; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 14px 6px; }
.title { display: flex; flex-direction: column; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.campaign-pick select {
  width: auto;
  border: 0; background-color: transparent; font-size: 20px; font-weight: 700; letter-spacing: -.01em;
  padding: 0 26px 0 0; min-height: 0; cursor: pointer;
  background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%;
}
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-left: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.live { background: var(--good); }
.dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
.actions { display: flex; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; list-style: none;
}
.btn:hover { background: var(--sunken); }
.btn[disabled] { opacity: .5; cursor: progress; }
.menu { position: relative; }
.menu summary::-webkit-details-marker { display: none; }
.menu summary::after { content: ""; display: inline-block; margin-left: 8px; border: 4px solid transparent; border-top-color: currentColor; transform: translateY(2px); }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; z-index: 30;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12); display: flex; flex-direction: column;
}
.menu-list button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu-list button:hover { background: var(--sunken); }

.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; padding-block: 4px 10px; }
.f { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f > span, .custom label > span { font-size: 11px; color: var(--muted); font-weight: 500; }
.custom { flex-direction: row; gap: 8px; }
.custom label { display: flex; flex-direction: column; gap: 2px; }
select, input[type="date"] {
  background-color: var(--surface); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 5px 28px 5px 10px; min-height: 32px; max-width: 100%; font-size: 13px;
}
input[type="date"] { padding-right: 8px; }
select {
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
.range-note { color: var(--muted); font-size: 12px; padding-bottom: 7px; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs button {
  border: 0; background: none; padding: 10px 12px; font-size: 14px; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.notice {
  max-width: var(--maxw); margin: 16px auto 0; padding: 10px 14px; border-radius: 10px;
  background: var(--accent-wash); color: var(--ink); font-size: 13px;
  margin-inline: max(var(--gutter), calc((100% - var(--maxw)) / 2));
}

/* ---------- Page ---------- */
.page { max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); padding-block: 22px 40px; }
.panel { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin: 0; padding: 18px 20px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.split.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .split, .split.even { grid-template-columns: minmax(0, 1fr); } }

/* Hero: the four numbers a PO reads first */
.hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hero .k { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hero .k-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.spark { width: 100%; height: 36px; margin-top: 6px; display: block; }

/* KPI grid: quiet cells separated by hairlines */
.kpis {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.kpis.compact { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis .k { padding: 14px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.k-label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; line-height: 1.3; }
.k-value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.k-value.na { font-size: 15px; font-weight: 500; color: var(--muted); padding-block: 4px; }
.k-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good-ink); }
.delta.down { color: var(--critical-ink); }
.delta.flat { color: var(--ink-2); }
.info {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
  border: 1px solid var(--line-2); color: var(--muted); font-size: 10px; font-weight: 700; cursor: help; flex: none;
}
.flag { font-size: 11px; color: var(--muted); border-bottom: 1px dotted var(--muted); cursor: help; white-space: nowrap; }
.flag.missing { color: var(--critical-ink); border-color: var(--critical-ink); }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.state.under::before { background: var(--warning); }
.state.over::before { background: var(--critical); }
.state.ok::before { background: var(--good); }

/* Card header */
.c-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
.c-head h3 { font-size: 15px; font-weight: 600; }
.c-note { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.c-tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.link { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--data-ghost) 0 4px, transparent 4px 7px) !important; }
.chart { width: 100%; height: 260px; min-width: 0; }
.empty { display: grid; place-items: center; text-align: center; min-height: 160px; color: var(--muted); font-size: 13px; padding: 16px; }
.empty strong { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }

/* Bar lists: ranked rows with an inline bar (used instead of heavy charts) */
.blist { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 128px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.brow:first-child { border-top: 0; }
.blist.tight .brow { grid-template-columns: max-content minmax(0, 1fr) 108px; }
.brow.head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-block: 0 6px; border-top: 0; }
.bname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.bname i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.btrack { position: relative; height: 8px; background: var(--sunken); border-radius: 4px; }
.bfill { position: absolute; inset: 0 auto 0 0; background: var(--data); border-radius: 4px; }
.btick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.bval { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bval small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.pacing .brow { grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 64px 132px; }
.pacing .brow.head > :nth-child(3) { text-align: right; }
@media (max-width: 640px) {
  .pacing .brow { grid-template-columns: minmax(0, 1fr) 56px; }
  .pacing .brow > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .pacing .brow > :nth-child(4) { grid-column: 1 / -1; }
  .pacing .brow.head { display: none; }
}

/* Points of attention */
.attention h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.attention ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.attention li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.attention li:first-child { border-top: 0; }
.attention li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transform: translateY(-1px); }
.attention li.warn::before { background: var(--warning); }
.attention li.bad::before { background: var(--critical); }
.attention li.good::before { background: var(--good); }
.attention li .go { white-space: nowrap; }

/* Tables */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
.data-view { margin-top: 8px; max-height: 300px; overflow: auto; border-top: 1px solid var(--line); }

.foot { max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); padding-block: 0 32px; color: var(--muted); font-size: 12px; }
.tip {
  position: fixed; z-index: 50; max-width: 300px; background: var(--ink); color: var(--bg);
  padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.45; pointer-events: none;
}

@media (max-width: 640px) {
  .bar { position: static; }
  .status { margin-left: 0; width: 100%; order: 3; }
  .hero .k-value { font-size: 24px; }
  .kpis, .kpis.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .k { padding: 12px 14px; }
  .k-value { font-size: 19px; }
  .card { padding: 14px; }
  .chart { height: 220px; }
  .brow { grid-template-columns: minmax(0, 1fr) auto; }
  .brow .btrack { grid-column: 1 / -1; grid-row: 2; }
}

</style>

<header class="bar" id="top">
  <div class="bar-row">
    <div class="title">
      <span class="eyebrow">Rapport de campagne</span>
      <label class="campaign-pick">
        <span class="sr">Campagne</span>
        <select id="f-campaign"></select>
      </label>
    </div>
    <div class="status">
      <span class="dot" id="freshness-dot"></span>
      <span id="freshness-text" role="status" aria-live="polite">Chargement…</span>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btn-refresh" hidden>Actualiser</button>
      <details class="menu" id="export-menu" hidden>
        <summary class="btn">Exporter</summary>
        <div class="menu-list" role="menu">
          <button type="button" role="menuitem" id="btn-export-kpi">KPI affichés (CSV)</button>
          <button type="button" role="menuitem" id="btn-export-data">Données détaillées (CSV)</button>
        </div>
      </details>
    </div>
  </div>

  <form class="filters" id="filters" aria-label="Filtres">
    <label class="f">
      <span>Période</span>
      <select id="f-period"></select>
    </label>
    <div class="f custom" id="custom-range" hidden>
      <label><span>Du</span><input type="date" id="f-from"></label>
      <label><span>Au</span><input type="date" id="f-to"></label>
    </div>
    <label class="f">
      <span>BU</span>
      <select id="f-region"></select>
    </label>
    <label class="f">
      <span>Bannière</span>
      <select id="f-banner">
        <option value="all">Toutes</option>
        <option value="Couche-Tard">Couche-Tard</option>
        <option value="Circle K">Circle K</option>
      </select>
    </label>
    <label class="f">
      <span>Comparer à</span>
      <select id="f-compare">
        <option value="prev">Période précédente</option>
        <option value="fy">FY26</option>
      </select>
    </label>
    <span class="range-note" id="range-note"></span>
  </form>

  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs">
    <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true">Vue d'ensemble</button>
    <button type="button" role="tab" id="tab-audience" aria-controls="panel-audience" aria-selected="false">Audience</button>
    <button type="button" role="tab" id="tab-prix" aria-controls="panel-prix" aria-selected="false">Prix</button>
    <button type="button" role="tab" id="tab-mecaniques" aria-controls="panel-mecaniques" aria-selected="false">Mécaniques</button>
    <button type="button" role="tab" id="tab-commercial" aria-controls="panel-commercial" aria-selected="false">Commercial</button>
    <button type="button" role="tab" id="tab-definitions" aria-controls="panel-definitions" aria-selected="false">Définitions</button>
  </nav>
</header>

<div class="notice" id="page-msg" hidden></div>

<main class="page">
  <section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div class="hero" id="hero"></div>
    <div class="kpis compact" id="kpis-overview"></div>
    <div class="split">
      <figure class="card" id="card-trend"></figure>
      <figure class="card" id="card-bu"></figure>
    </div>
    <div class="card attention" id="attention"></div>
  </section>

  <section class="panel" id="panel-audience" role="tabpanel" aria-labelledby="tab-audience" hidden>
    <div class="kpis" id="kpis-audience"></div>
    <figure class="card" id="card-active"></figure>
    <div class="split even">
      <figure class="card" id="card-signups"></figure>
      <figure class="card" id="card-downloads"></figure>
    </div>
  </section>

  <section class="panel" id="panel-prix" role="tabpanel" aria-labelledby="tab-prix" hidden>
    <div class="kpis" id="kpis-prix"></div>
    <figure class="card" id="card-prizes-daily"></figure>
    <figure class="card" id="card-pacing"></figure>
    <figure class="card" id="card-entries"></figure>
  </section>

  <section class="panel" id="panel-mecaniques" role="tabpanel" aria-labelledby="tab-mecaniques" hidden>
    <div class="kpis" id="kpis-mecaniques"></div>
    <div class="split even">
      <figure class="card" id="card-bonus"></figure>
      <figure class="card" id="card-badges"></figure>
    </div>
    <figure class="card" id="card-ads"></figure>
  </section>

  <section class="panel" id="panel-commercial" role="tabpanel" aria-labelledby="tab-commercial" hidden>
    <div class="kpis" id="kpis-commercial"></div>
    <div class="split even">
      <figure class="card" id="card-coupons"></figure>
      <figure class="card" id="card-lift"></figure>
    </div>
  </section>

  <section class="panel" id="panel-definitions" role="tabpanel" aria-labelledby="tab-definitions" hidden>
    <div class="card"><div class="table-wrap"><table class="data" id="def-table"></table></div></div>
  </section>
</main>

<footer class="foot">
  <span>Données agrégées seulement. Aucune donnée personnelle n'est affichée ni exportée.</span>
</footer>

<script id="report-data" type="application/json">{"queries": {"q01": {"file": "01_audience_daily.sql", "sql": "-- Audience et engagement — daily, by region\n-- Grain: campaign x day x region. KPIs: inscriptions, joueurs actifs (DAU), parties jouées.\n-- Distinct players are additive across regions (a player has one province),\n-- but NOT across days: use 02_audience_period.sql for period-level uniques.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\ngames AS (\n  SELECT s.contest_date AS day, pl.region_code,\n         SUM(s.status IN ('won', 'lost', 'draw')) AS games_played,\n         SUM(s.status = 'quit') AS games_quit,\n         COUNT(DISTINCT s.rpp_player_id) AS active_players\n  FROM rctapi_rpp_game_sessions s\n  JOIN campaign c ON s.contest_date BETWEEN c.start_date AND c.end_date\n  JOIN players pl ON pl.rpp_player_id = s.rpp_player_id\n  GROUP BY s.contest_date, pl.region_code\n),\nsignups AS (\n  SELECT DATE(CONVERT_TZ(pl.created_at, 'UTC', c.tz)) AS day, pl.region_code,\n         COUNT(*) AS signups\n  FROM players pl\n  JOIN campaign c ON pl.created_at BETWEEN c.start_at AND c.end_at\n  GROUP BY day, pl.region_code\n),\ngrid AS (\n  SELECT day, region_code FROM games\n  UNION\n  SELECT day, region_code FROM signups\n)\nSELECT c.code AS campaign, gr.day, gr.region_code,\n       COALESCE(su.signups, 0) AS signups,\n       COALESCE(ga.active_players, 0) AS active_players,\n       COALESCE(ga.games_played, 0) AS games_played,\n       COALESCE(ga.games_quit, 0) AS games_quit\nFROM grid gr\nCROSS JOIN campaign c\nLEFT JOIN games ga ON ga.day = gr.day AND ga.region_code = gr.region_code\nLEFT JOIN signups su ON su.day = gr.day AND su.region_code = gr.region_code\nORDER BY gr.day, gr.region_code\n"}, "q02": {"file": "02_audience_period.sql", "sql": "-- Audience et engagement — whole campaign, by region\n-- KPIs: joueurs uniques, nouveaux joueurs aux jeux Circle K, DAU moyen,\n--       taux de visites répétées, parties par jour actif (proxy sessions/utilisateur).\n-- For a sub-period (week, previous period) narrow the contest_date filter.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\nplayer_activity AS (\n  SELECT s.rpp_player_id,\n         COUNT(DISTINCT s.contest_date) AS active_days,\n         SUM(s.status IN ('won', 'lost', 'draw')) AS games_played\n  FROM rctapi_rpp_game_sessions s\n  JOIN campaign c ON s.contest_date BETWEEN c.start_date AND c.end_date\n  GROUP BY s.rpp_player_id\n),\nprior_ck_players AS (\n  -- Users who played another Circle K / Couche-Tard game before this campaign\n  SELECT DISTINCT x.user_id FROM (\n    SELECT user_id, started_at AS ts FROM rctapi_labatt_game_session\n    UNION ALL SELECT user_id, created_at FROM rctapi_nhl_game_participations\n    UNION ALL SELECT user_id, created_at FROM rctapi_games_external_participation\n    UNION ALL SELECT client_id, created_at FROM craft_ctapi_game_participations\n  ) x\n  JOIN campaign c ON x.ts < c.start_at\n)\nSELECT c.code AS campaign, pl.region_code,\n       COUNT(*) AS unique_players,\n       SUM(pp.user_id IS NULL) AS new_to_ck_games,\n       SUM(pa.active_days >= 2) AS repeat_players,\n       ROUND(SUM(pa.active_days >= 2) / COUNT(*), 4) AS repeat_visit_rate,\n       SUM(pa.games_played) AS games_played,\n       SUM(pa.active_days) AS player_days,\n       ROUND(SUM(pa.games_played) / SUM(pa.active_days), 3) AS games_per_active_day,\n       ROUND(SUM(pa.active_days) / (DATEDIFF(c.end_date, c.start_date) + 1), 1) AS avg_dau\nFROM player_activity pa\nJOIN players pl ON pl.rpp_player_id = pa.rpp_player_id\nLEFT JOIN prior_ck_players pp ON pp.user_id = pl.user_id\nCROSS JOIN campaign c\nGROUP BY c.code, pl.region_code, c.end_date, c.start_date\nORDER BY pl.region_code\n"}, "q03": {"file": "03_audience_weekly.sql", "sql": "-- Audience et engagement — weekly active users, by region\n-- Week = ISO week starting Monday (switch to the Couche-Tard fiscal week once the calendar is seeded).\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign,\n       DATE_SUB(s.contest_date, INTERVAL WEEKDAY(s.contest_date) DAY) AS week_start,\n       pl.region_code,\n       COUNT(DISTINCT s.rpp_player_id) AS wau,\n       SUM(s.status IN ('won', 'lost', 'draw')) AS games_played\nFROM rctapi_rpp_game_sessions s\nJOIN campaign c ON s.contest_date BETWEEN c.start_date AND c.end_date\nJOIN players pl ON pl.rpp_player_id = s.rpp_player_id\nGROUP BY c.code, week_start, pl.region_code\nORDER BY week_start, pl.region_code\n"}, "q04": {"file": "04_prizes_by_promotion.sql", "sql": "-- Prix et distribution — per prize x partner x region (one row per promotion)\n-- Roll up to partner level by summing inventory / won / released / net_awarded, then recompute ratios.\n-- KPIs: prix gagnés, prix échangés, prix restants, rythme vs plan linéaire.\n-- Unredeemed coupons are released back to stock after a timeout\n-- (release_reason = 'rpp_unredeemed_timeout'), so:\n--   net_awarded = won - released        (inventory actually consumed)\n--   remaining   = inventory - net_awarded\n-- Plan = inventory spread evenly between promotion start_date and end_date.\n-- pacing_index < 0.9 => UNDER, > 1.1 => OVER (tolerance to confirm per prize tier).\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\npromos AS (\n  SELECT p.id AS promotion_id, p.quantity AS inventory, p.start_date, p.end_date,\n         (SELECT pi.title FROM rctapi_promotion_items pi\n           WHERE pi.promotion_id = p.id\n           ORDER BY pi.language = 'fr' DESC LIMIT 1) AS prize_fr,\n         (SELECT MIN(g.region_code) FROM rctapi_promotion_province pp\n           JOIN rctapi_provinces pr ON pr.id = pp.province_id\n           JOIN geo g ON g.province_code = pr.name\n           WHERE pp.promotion_id = p.id) AS region_code\n  FROM rctapi_promotions p\n  JOIN campaign c ON p.campaign = c.promotion_campaign\n),\npromos_partner AS (\n  SELECT pr.*,\n         COALESCE((SELECT pm.partner FROM partner_map pm\n                    WHERE LOWER(pr.prize_fr) LIKE CONCAT('%', pm.pattern, '%')\n                    ORDER BY pm.priority LIMIT 1), 'À associer (seeds/partners.csv)') AS partner\n  FROM promos pr\n),\ngrants AS (\n  SELECT g.promotion_id,\n         COUNT(*) AS won,\n         SUM(g.activation_id IS NOT NULL) AS redeemed,\n         SUM(g.release_reason = 'rpp_unredeemed_timeout') AS released,\n         SUM(g.deleted_at IS NOT NULL AND g.activation_id IS NULL\n             AND COALESCE(g.release_reason, '') <> 'rpp_unredeemed_timeout') AS other_removed\n  FROM rctapi_promotion_grant g\n  JOIN promos pr ON pr.promotion_id = g.promotion_id\n  WHERE g.type = 'rpp_instant_prize'\n  GROUP BY g.promotion_id\n)\nSELECT c.code AS campaign, pr.region_code, pr.partner, pr.prize_fr, pr.promotion_id,\n       pr.inventory,\n       COALESCE(gr.won, 0) AS won,\n       COALESCE(gr.redeemed, 0) AS redeemed,\n       COALESCE(gr.released, 0) AS released_to_stock,\n       COALESCE(gr.other_removed, 0) AS other_removed,\n       COALESCE(gr.won, 0) - COALESCE(gr.released, 0) AS net_awarded,\n       pr.inventory - (COALESCE(gr.won, 0) - COALESCE(gr.released, 0)) AS remaining,\n       ROUND(COALESCE(gr.redeemed, 0) / NULLIF(gr.won, 0), 4) AS redemption_rate,\n       ROUND(pr.inventory * LEAST(1, GREATEST(0,\n         TIMESTAMPDIFF(SECOND, pr.start_date, LEAST(UTC_TIMESTAMP(), pr.end_date))\n         / TIMESTAMPDIFF(SECOND, pr.start_date, pr.end_date)))) AS planned_to_date,\n       ROUND((COALESCE(gr.won, 0) - COALESCE(gr.released, 0)) / NULLIF(pr.inventory * LEAST(1, GREATEST(0,\n         TIMESTAMPDIFF(SECOND, pr.start_date, LEAST(UTC_TIMESTAMP(), pr.end_date))\n         / TIMESTAMPDIFF(SECOND, pr.start_date, pr.end_date))), 0), 3) AS pacing_index\nFROM promos_partner pr\nCROSS JOIN campaign c\nLEFT JOIN grants gr ON gr.promotion_id = pr.promotion_id\nORDER BY pr.partner, pr.prize_fr, pr.region_code\n"}, "q05": {"file": "05_prizes_daily.sql", "sql": "-- Prix et distribution — daily awards by region (feeds the pacing curve)\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\npromos AS (\n  SELECT p.id AS promotion_id,\n         (SELECT MIN(g.region_code) FROM rctapi_promotion_province pp\n           JOIN rctapi_provinces pr ON pr.id = pp.province_id\n           JOIN geo g ON g.province_code = pr.name\n           WHERE pp.promotion_id = p.id) AS region_code\n  FROM rctapi_promotions p\n  JOIN campaign c ON p.campaign = c.promotion_campaign\n)\nSELECT c.code AS campaign,\n       DATE(CONVERT_TZ(g.created_at, 'UTC', c.tz)) AS day,\n       pr.region_code,\n       COUNT(*) AS won,\n       SUM(g.activation_id IS NOT NULL) AS redeemed_from_day,\n       SUM(g.release_reason = 'rpp_unredeemed_timeout') AS released_from_day\nFROM rctapi_promotion_grant g\nJOIN promos pr ON pr.promotion_id = g.promotion_id\nCROSS JOIN campaign c\nWHERE g.type = 'rpp_instant_prize'\nGROUP BY c.code, day, pr.region_code\nORDER BY day, pr.region_code\n"}, "q06": {"file": "06_grand_prize_entries.sql", "sql": "-- Prix et distribution — participations au grand prix, by day x region\n-- Sources are pivoted into columns to stay far below the MCP's 1000-row limit.\n-- Until minigame_entries gets edition_id, the edition is resolved by date window.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign,\n       DATE(CONVERT_TZ(e.created_at, 'UTC', c.tz)) AS day,\n       pl.region_code,\n       SUM(e.quantity) AS entries,\n       SUM(CASE WHEN e.source = 'gameplay' THEN e.quantity ELSE 0 END) AS entries_gameplay,\n       SUM(CASE WHEN e.source = 'badge' THEN e.quantity ELSE 0 END) AS entries_badge,\n       SUM(CASE WHEN e.source = 'bonus' THEN e.quantity ELSE 0 END) AS entries_bonus,\n       SUM(CASE WHEN e.source = 'referral' THEN e.quantity ELSE 0 END) AS entries_referral,\n       SUM(CASE WHEN e.source NOT IN ('gameplay', 'badge', 'bonus', 'referral') THEN e.quantity ELSE 0 END) AS entries_other\nFROM rctapi_minigame_entries e\nJOIN campaign c ON e.created_at BETWEEN c.start_at AND c.end_at\nJOIN players pl ON pl.rpp_player_id = e.rpp_player_id\nGROUP BY c.code, day, pl.region_code\nORDER BY day, pl.region_code\n"}, "q07": {"file": "07_bonus_actions_badges.sql", "sql": "-- Mécaniques de jeu — actions bonus et défis (badges), by region\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\neligible AS (\n  SELECT pl.region_code, COUNT(*) AS players\n  FROM players pl JOIN campaign c ON pl.created_at <= c.end_at\n  GROUP BY pl.region_code\n)\nSELECT c.code AS campaign, 'bonus_action' AS kind, b.`key`, b.title_fr, pl.region_code,\n       COUNT(*) AS completions,\n       COUNT(DISTINCT pb.rpp_player_id) AS players,\n       ROUND(COUNT(DISTINCT pb.rpp_player_id) / MAX(el.players), 4) AS completion_rate,\n       MAX(el.players) AS eligible_players\nFROM rctapi_minigame_bonus_actions b\nJOIN campaign c ON b.edition_id = c.edition_id\nJOIN rctapi_minigame_participation_bonus_actions pb ON pb.rpp_bonus_action_id = b.id\nJOIN players pl ON pl.rpp_player_id = pb.rpp_player_id\nJOIN eligible el ON el.region_code = pl.region_code\nGROUP BY c.code, b.`key`, b.title_fr, pl.region_code\nUNION ALL\nSELECT c.code, 'badge', bd.`key`, bd.title_fr, pl.region_code,\n       COUNT(*),\n       COUNT(DISTINCT pb.rpp_player_id),\n       ROUND(COUNT(DISTINCT pb.rpp_player_id) / MAX(el.players), 4),\n       MAX(el.players)\nFROM rctapi_minigame_badges bd\nJOIN campaign c ON bd.edition_id = c.edition_id\nJOIN rctapi_minigame_participation_badges pb ON pb.rpp_badge_id = bd.id AND pb.is_earned = 1\nJOIN players pl ON pl.rpp_player_id = pb.rpp_player_id\nJOIN eligible el ON el.region_code = pl.region_code\nGROUP BY c.code, bd.`key`, bd.title_fr, pl.region_code\nORDER BY kind, `key`, region_code\n"}, "q08": {"file": "08_referrals.sql", "sql": "-- Mécaniques de jeu — parrainage, by region of the referrer\n-- Only converted referrals are logged; invites sent are not tracked yet.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign, pl.region_code,\n       COUNT(DISTINCT r.referrer_rpp_player_id) AS referrers,\n       COUNT(*) AS successful_referrals\nFROM rctapi_minigame_referrals r\nJOIN campaign c ON r.created_at BETWEEN c.start_at AND c.end_at\nJOIN players pl ON pl.rpp_player_id = r.referrer_rpp_player_id\nGROUP BY c.code, pl.region_code\nORDER BY pl.region_code\n"}, "q09": {"file": "09_ads_by_partner.sql", "sql": "-- Mécaniques de jeu — impressions et vues uniques des pubs, par partenaire x region\n-- impressions = ad serves; completed_views = watched to the end; unique_viewers = distinct players.\n-- Partner comes from seeds/partners.csv (normalizes 'Red bull' / 'Red Bull', etc.).\n-- Serves are aggregated per player before the join to stay under the MCP 60 s timeout.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n),\nads AS (\n  SELECT a.id,\n         COALESCE((SELECT pm.partner FROM partner_map pm\n                    WHERE LOWER(a.advertiser) LIKE CONCAT('%', pm.pattern, '%')\n                    ORDER BY pm.priority LIMIT 1), TRIM(a.advertiser)) AS partner\n  FROM rctapi_minigame_ads a\n  JOIN campaign c ON a.edition_id = c.edition_id\n),\nper_player AS (\n  SELECT ads.partner, s.rpp_player_id,\n         COUNT(*) AS impressions,\n         SUM(s.completed_at IS NOT NULL) AS completed_views\n  FROM rctapi_minigame_participation_ad_serves s\n  JOIN ads ON ads.id = s.rpp_ad_id\n  GROUP BY ads.partner, s.rpp_player_id\n)\nSELECT c.code AS campaign, pp.partner, pl.region_code,\n       SUM(pp.impressions) AS impressions,\n       SUM(pp.completed_views) AS completed_views,\n       COUNT(*) AS unique_viewers\nFROM per_player pp\nJOIN players pl ON pl.rpp_player_id = pp.rpp_player_id\nCROSS JOIN campaign c\nGROUP BY c.code, pp.partner, pl.region_code\nORDER BY pp.partner, pl.region_code\n"}, "q10": {"file": "10_lift_purchases.sql", "sql": "-- Impact commercial — LIFT purchases attributed to the game, by day x region\n-- Scope: purchases matched via the 'checkout' bonus action (phone number at the till).\n-- Not total store revenue. No store id is available, so region = player's province.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign,\n       DATE(CONVERT_TZ(pa.occurred_at, 'UTC', c.tz)) AS day,\n       pl.region_code,\n       COUNT(*) AS lift_transactions,\n       SUM(pa.total_price) AS lift_revenue,\n       SUM(pa.item_count) AS items,\n       SUM(pa.eligible_upc_count) AS eligible_items,\n       COUNT(DISTINCT pa.rpp_player_id) AS buyers\nFROM rctapi_minigame_purchase_attributions pa\nJOIN campaign c ON pa.campaign_id = c.purchase_campaign_id\nJOIN players pl ON pl.rpp_player_id = pa.rpp_player_id\nWHERE pa.event_type = 'LIFT' AND pa.status = 'credited'\nGROUP BY c.code, day, pl.region_code\nORDER BY day, pl.region_code\n"}, "q11": {"file": "11_coupon_redemptions_daily.sql", "sql": "-- Impact commercial — coupon activations in store (numerator of coupon contribution to traffic)\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign,\n       DATE(CONVERT_TZ(a.created_at, 'UTC', c.tz)) AS day,\n       COALESCE(pl.region_code, 'UNASSIGNED') AS region_code,\n       COUNT(*) AS coupon_activations,\n       COUNT(DISTINCT a.user_id) AS redeeming_users\nFROM rctapi_promotion_activations a\nJOIN rctapi_promotions p ON p.id = a.promotion_id\nJOIN campaign c ON p.campaign = c.promotion_campaign\nLEFT JOIN players pl ON pl.user_id = a.user_id\nWHERE a.deleted_at IS NULL\nGROUP BY c.code, day, region_code\nORDER BY day, region_code\n"}, "q12": {"file": "12_app_downloads_daily.sql", "sql": "-- Audience — app downloads per day, by app (banner) and source\n-- Not attributed to paid media: iOS gives the App Store source type only, Android gives totals.\n-- No province split is available.\n-- Also returns the same number of days BEFORE launch (in_campaign = 0) as a baseline.\nWITH {{CAMPAIGN}},\ngeo (province_code, region_code, client_rollup, banner) AS (\n  VALUES\n    ROW('NS', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NB', 'ATL', 'Eastern', 'Circle K'),\n    ROW('PE', 'ATL', 'Eastern', 'Circle K'),\n    ROW('NL', 'ATL', 'Eastern', 'Circle K'),\n    ROW('QC', 'QC', 'Eastern', 'Couche-Tard'),\n    ROW('ON', 'CC', 'Central', 'Circle K'),\n    ROW('BC', 'WC', 'Western', 'Circle K'),\n    ROW('AB', 'WC', 'Western', 'Circle K'),\n    ROW('SK', 'WC', 'Western', 'Circle K'),\n    ROW('MB', 'WC', 'Western', 'Circle K'),\n    ROW('NT', 'WC', 'Western', 'Circle K'),\n    ROW('NU', 'WC', 'Western', 'Circle K'),\n    ROW('YT', 'WC', 'Western', 'Circle K')\n),\npartner_map (priority, pattern, partner) AS (\n  VALUES\n    ROW(1, 'reese', 'Hershey'),\n    ROW(1, 'hershey', 'Hershey'),\n    ROW(1, 'snickers', 'Mars (Snickers)'),\n    ROW(1, 'takis', 'Takis'),\n    ROW(1, 'electrolit', 'Electrolit'),\n    ROW(1, 'celsius', 'Celsius'),\n    ROW(1, 'c4 energy', 'C4 Energy'),\n    ROW(1, 'red bull', 'Red Bull'),\n    ROW(1, 'guru', 'Guru'),\n    ROW(1, 'fuze', 'Fuze'),\n    ROW(1, 'powerade', 'Powerade / Bodyarmor'),\n    ROW(1, 'vitaminwater', 'Vitaminwater'),\n    ROW(1, 'fizz', 'Fizz'),\n    ROW(1, 'chico', 'Chico'),\n    ROW(1, 'pet valu', 'Pet Valu'),\n    ROW(1, 'petvalue', 'Pet Valu'),\n    ROW(1, 'joker', 'Joker Énergie'),\n    ROW(1, 'arizona', 'Arizona'),\n    ROW(2, 'essence', 'Bannière — carburant'),\n    ROW(2, 'lave-auto', 'Bannière — lave-auto'),\n    ROW(2, 'lavo-auto', 'Bannière — lave-auto'),\n    ROW(3, 'couche-tard', 'Bannière — marque maison'),\n    ROW(3, 'polar pop', 'Bannière — marque maison'),\n    ROW(3, 'sloche', 'Bannière — marque maison'),\n    ROW(3, 'taquitos', 'Bannière — marque maison'),\n    ROW(3, 'hot dog', 'Bannière — marque maison'),\n    ROW(2, 'fuel', 'Bannière — carburant'),\n    ROW(2, 'car wash', 'Bannière — lave-auto'),\n    ROW(3, 'pizza', 'Bannière — marque maison')\n),\nplayers AS (\n  SELECT p.id AS rpp_player_id, p.user_id, p.created_at,\n         COALESCE(g.region_code, 'UNASSIGNED') AS region_code,\n         COALESCE(g.client_rollup, 'UNASSIGNED') AS client_rollup,\n         COALESCE(g.banner, 'UNASSIGNED') AS banner\n  FROM rctapi_minigame_players p\n  LEFT JOIN geo g ON g.province_code = p.province\n  LEFT JOIN craft_ctapi_clients cl ON cl.id = p.user_id\n  WHERE p.banned_at IS NULL\n    AND COALESCE(cl.is_tester, 0) = 0\n    AND COALESCE(cl.is_employee, 0) = 0\n)\nSELECT c.code AS campaign, o.observation_date AS day,\n       (o.observation_date >= c.start_date) AS in_campaign,\n       o.ct_ios_first_time_downloads AS couche_tard_ios,\n       o.ck_ios_first_time_downloads AS circle_k_ios,\n       o.ct_android_daily_user_installs AS couche_tard_android,\n       o.ck_android_daily_user_installs AS circle_k_android,\n       -- iOS first-time downloads coming from a web referrer (QR codes, landing pages, web ads)\n       COALESCE(JSON_EXTRACT(o.ct_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"Product page\"'), 0)\n         + COALESCE(JSON_EXTRACT(o.ct_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"Store sheet\"'), 0)\n         + COALESCE(JSON_EXTRACT(o.ct_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"No page\"'), 0) AS couche_tard_ios_web_referrer,\n       COALESCE(JSON_EXTRACT(o.ck_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"Product page\"'), 0)\n         + COALESCE(JSON_EXTRACT(o.ck_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"Store sheet\"'), 0)\n         + COALESCE(JSON_EXTRACT(o.ck_ios_dimensions, '$.\"First-time download\".\"Web referrer\".\"No page\"'), 0) AS circle_k_ios_web_referrer\nFROM rctapi_analytics_daily_observations o\nJOIN campaign c\n  ON o.observation_date BETWEEN DATE_SUB(c.start_date, INTERVAL DATEDIFF(c.end_date, c.start_date) + 1 DAY)\n                            AND c.end_date\nORDER BY o.observation_date\n"}}, "campaigns": [{"edition_id": "1", "code": "rpp-2026", "name_fr": "RPP 2026", "name_en": "RPP 2026", "game_type": "rpp", "start_at_local": "2026-07-21 00:00:00", "end_at_local": "2026-09-14 23:59:59", "redemption_end_at_local": "2026-09-19 23:59:59", "timezone": "America/Toronto", "fiscal_year": "FY27", "promotion_campaign": "rpp-2026", "purchase_campaign_id": "rpp-2026", "comparison_edition_id": "", "status": "closed"}, {"edition_id": "", "code": "31dock", "name_fr": "31DOCK", "name_en": "31DOCK", "game_type": "TBD", "start_at_local": "TBD", "end_at_local": "TBD", "redemption_end_at_local": "TBD", "timezone": "America/Toronto", "fiscal_year": "TBD", "promotion_campaign": "TBD", "purchase_campaign_id": "TBD", "comparison_edition_id": "", "status": "planned"}], "regions": [{"province_code": "NS", "province_name_fr": "Nouvelle-Écosse", "region_code": "ATL", "region_name": "Atlantic Canada", "contest_region": "atlantic", "client_rollup": "Eastern", "db_business_unit": "Eastern Canada", "banner_default": "Circle K"}, {"province_code": "NB", "province_name_fr": "Nouveau-Brunswick", "region_code": "ATL", "region_name": "Atlantic Canada", "contest_region": "atlantic", "client_rollup": "Eastern", "db_business_unit": "Eastern Canada", "banner_default": "Circle K"}, {"province_code": "PE", "province_name_fr": "Île-du-Prince-Édouard", "region_code": "ATL", "region_name": "Atlantic Canada", "contest_region": "atlantic", "client_rollup": "Eastern", "db_business_unit": "Eastern Canada", "banner_default": "Circle K"}, {"province_code": "NL", "province_name_fr": "Terre-Neuve-et-Labrador", "region_code": "ATL", "region_name": " f period.", "definition_fr": "Inventaire initial moins les prix réellement distribués. Les coupons non échangés à temps retournent dans l'inventaire.", "source_fr": "rctapi_promotions (inventaire) et rctapi_promotion_grant", "status": "available", "source": "rctapi_promotions.quantity - (grants - grants released with release_reason='rpp_unredeemed_timeout') (sql/kpi/04)"}, {"id": "distribution_pacing", "label_fr": "Rythme de distribution (sous/sur-distribution)", "category": "prizes", "type": "derived", "breakdowns": ["prize_id", "partner_id"], "definition": "actual_awarded_to_date / planned_to_date; UNDER/ON_TRACK/OVER by tolerance; projected run-out date.", "definition_fr": "Prix distribués ÷ plan linéaire à date, par prix et par partenaire. Sous 90 % : sous-distribution ; au-dessus de 110 % : sur-distribution.", "source_fr": "rctapi_promotion_grant ; partenaires selon seeds/partners.csv", "status": "available", "source": "net awards (won - released) per promotion vs linear plan; partner from seeds/partners.csv (sql/kpi/04)"}, {"id": "grand_prize_entries", "label_fr": "Participations au grand prix générées", "category": "prizes", "type": "additive", "definition_fr": "Participations au tirage du grand prix, par source (parties, défis, actions bonus, parrainage).", "source_fr": "rctapi_minigame_entries", "status": "available", "source": "rctapi_minigame_entries SUM(quantity) by source, contest_region_snapshot"}, {"id": "bonus_challenge_completions", "label_fr": "Complétion des actions bonus et des défis", "category": "mechanics", "type": "additive", "breakdowns": ["action_id"], "companion": "completion rate = completers / exposed players", "definition_fr": "Actions bonus complétées (abonnement courriel ou SMS, réseaux sociaux, vidéo, caisse) et défis réussis (badges).", "source_fr": "rctapi_minigame_participation_bonus_actions et _badges", "status": "available", "source": "rctapi_minigame_participation_bonus_actions + rctapi_minigame_participation_badges"}, {"id": "
